<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수도권 전철 실시간</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --rail: #d4d4d8;
    --card: #f4f4f5;
    --edge: #e4e4e7;
    --warn-bg: #fff4e5;
    --warn-fg: #9a3412;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --fg: #f4f4f5;
      --muted: #9ca3af;
      --rail: #3f3f46;
      --card: #1e1e21;
      --edge: #2a2a2e;
      --warn-bg: #3b2410;
      --warn-fg: #fdba74;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px 16px 40px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 19px; margin: 0 0 2px; }
  #budget { font-size: 12px; color: var(--muted); }

  /* 노선 하나가 한 덩어리다. 접으면 폴링도 멈춘다. */
  .line { border-top: 1px solid var(--edge); padding: 12px 0 4px; }
  .line-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .line-toggle {
    display: flex; align-items: center; gap: 7px;
    border: 0; background: none; color: inherit; cursor: pointer;
    font: 600 16px/1.4 inherit; padding: 2px 0;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .caret { color: var(--muted); font-size: 11px; }
  .line-status { font-size: 12px; color: var(--muted); }
  .line-body { padding-top: 6px; }
  .legend { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .legend b { color: var(--warn-fg); background: var(--warn-bg); padding: 1px 5px; border-radius: 4px; font-weight: 600; }

  /* 편성 차수 범례. 색이 무엇을 뜻하는지 여기서만 말한다. */
  .fleet-legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12px; margin: 0 0 10px; }
  .fleet-chip {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--muted); text-decoration: none;
    border-bottom: 1px dashed var(--muted);
  }
  .fleet-chip::before {
    content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--fleet);
  }
  /* 어느 문서의 몇 번째 판에서 옮겼는지. CC BY 조건이라 화면에서 뺄 수 없다. */
  .credits { margin-top: 10px; font-size: 11px; color: var(--muted); line-height: 1.7; }
  .credits a { color: inherit; }

  .rail { position: relative; }
  .rail::before {
    content: ""; position: absolute; left: 50%; top: 10px; bottom: 10px;
    width: 2px; margin-left: -1px; background: var(--rail);
  }
  .stop { display: grid; grid-template-columns: 1fr 104px 1fr; align-items: center; min-height: 38px; }
  /* 레일 선이 역 이름 뒤로 지나간다. 이름에 배경을 깔아 선을 끊어 보이게 하는데,
     선이 absolute 라 그것만으로는 글자 위에 그려진다. 쌓임 순서를 올려 덮는다. */
  .name { text-align: center; font-size: 13px; }
  .name span, .name button {
    position: relative; z-index: 1;
    background: var(--bg); padding: 2px 6px; border-radius: 4px;
  }
  .name .key { font-weight: 700; }
  .lane { display: flex; gap: 6px; flex-wrap: wrap; min-height: 24px; align-items: center; }
  .lane.up { justify-content: flex-end; }
  .lane.down { justify-content: flex-start; }

  .train {
    background: var(--card); border-radius: 6px; padding: 3px 8px;
    font-size: 12px; white-space: nowrap; line-height: 1.35;
  }
  /* 차수 색은 왼쪽 막대로만 쓴다. 칩 배경을 물들이면 단축 운행 표시와 겹친다. */
  .train.fleet { border-left: 3px solid var(--fleet); padding-left: 5px; }
  .train.short { background: var(--warn-bg); color: var(--warn-fg); font-weight: 600; }
  .train .no { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .train.express::before { content: "급행 "; font-size: 11px; font-weight: 600; }
  .train.last::after { content: " 막차"; font-size: 11px; color: var(--warn-fg); }

  .scope { font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .scope button {
    border: 0; background: var(--card); color: inherit; cursor: pointer;
    font: inherit; padding: 3px 9px; border-radius: 999px;
  }

  /* 환승역만 눌러서 펼칠 수 있다. 점선 밑줄이 그 표시다. */
  .name button {
    border: 0; font: inherit; color: inherit; cursor: pointer;
    border-bottom: 1px dashed var(--muted);
  }
  .name button[aria-expanded="true"] { background: var(--card); }

  /* 레일 세로선이 absolute 라 배경만으로는 안 가려진다.
     폭을 풀어 두면 넓은 화면에서 문 번호가 노선명과 화면 양끝으로 갈라져 같은 줄로 안 읽힌다. */
  .transfer {
    position: relative; z-index: 1;
    max-width: 520px; margin: 2px auto 10px;
    background: var(--card); border-radius: 8px;
    padding: 10px 12px; font-size: 12px;
  }
  /* 문 번호를 오른쪽 끝에 세워 세로로 훑을 수 있게 한다. */
  .tr-row { display: flex; gap: 10px; align-items: baseline; padding: 2px 0; }
  .tr-dir { min-width: 62px; color: var(--muted); }
  .tr-line { flex: 1; }
  /* 갈아탈 노선의 색. 이름만으로는 어느 노선인지 한눈에 안 들어온다. */
  .line-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 4px;
  }
  .tr-door { font-weight: 600; }
  .tr-note { margin: 8px 0 0; color: var(--muted); line-height: 1.5; }

  footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--edge); font-size: 12px; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>수도권 전철 실시간</h1>
  <div id="budget"></div>
</header>

<div id="lines"></div>

<footer>
  자료: 서울시 실시간 지하철 정보, 용인경전철. 환승 문 위치와 편성 차수의 출처는 노선마다 적었습니다.
</footer>

<script>
const REFRESH_MS = 30000;
const STORAGE_KEY = 'kennymetro.view';

let lines = [];
let budget = { apiCallBudget: 0, apiCallCount: 0 };
let transfersByLine = {};
let transferColors = {};

// 펼친 노선과 전 구간 보기 여부는 사람마다 다르다. 서버에 계정이 없으므로 이 브라우저에만 둔다.
let view = { open: [], full: [] };

function loadView() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && Array.isArray(saved.open) && Array.isArray(saved.full)) view = saved;
  } catch (e) {
    // 사생활 보호 모드나 저장소 차단. 기본값으로 간다.
  }
}

function saveView() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(view));
  } catch (e) {
    // 저장에 실패해도 이번 방문에는 영향이 없다.
  }
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function isOpen(slug) { return view.open.includes(slug); }
function isFull(slug) { return view.full.includes(slug); }

function toggleIn(list, slug) {
  const i = list.indexOf(slug);
  if (i < 0) list.push(slug); else list.splice(i, 1);
  saveView();
}

/* ---------- 노선도 ---------- */

/** 화면에 그릴 역 범위. 전 구간 보기가 아니면 관심 구간만 그린다. */
function rangeOf(line) {
  if (isFull(line.slug) || line.focusFrom === null || line.focusTo === null) {
    return { from: 0, to: line.stations.length - 1 };
  }
  return { from: line.focusFrom, to: line.focusTo };
}

function buildRail(line) {
  const rail = el('div', 'rail');
  const range = rangeOf(line);
  const transfers = transfersByLine[line.slug];
  for (let i = range.from; i <= range.to; i++) {
    const name = line.stations[i];
    const stop = el('div', 'stop');
    stop.dataset.index = String(i);
    stop.appendChild(el('div', 'lane up', ''));

    const label = el('div', 'name');
    const info = transfers && transfers.byStation.get(name);
    const panelId = 'tr-' + line.slug + '-' + i;
    const node = info ? transferToggle(name, panelId) : el('span', null, name);
    if (line.keyStations.includes(name)) node.classList.add('key');
    label.appendChild(node);
    stop.appendChild(label);

    stop.appendChild(el('div', 'lane down', ''));
    rail.appendChild(stop);
    if (info) rail.appendChild(buildTransferPanel(panelId, info));
  }
  return rail;
}

function placeTrains(section, line, trains) {
  section.querySelectorAll('.lane').forEach(l => l.replaceChildren());
  const range = rangeOf(line);
  let outside = 0;
  for (const t of trains) {
    const idx = line.stations.indexOf(t.currentStation);
    if (idx < 0) continue;
    if (idx < range.from || idx > range.to) { outside++; continue; }
    const stop = section.querySelector('.stop[data-index="' + idx + '"]');
    if (!stop) continue;
    const lane = stop.querySelector(t.direction === 'UP' ? '.lane.up' : '.lane.down');
    lane.appendChild(trainChip(line, t));
  }
  return outside;
}

function trainChip(line, t) {
  let cls = 'train';
  if (t.isShortTurn) cls += ' short';
  if (t.isLastTrain) cls += ' last';
  if (t.isExpress) cls += ' express';
  if (t.fleet) cls += ' fleet';
  const chip = el('div', cls);
  if (t.fleet) {
    const gen = line.fleet.generations.find(g => g.label === t.fleet);
    if (gen) chip.style.setProperty('--fleet', gen.color);
    chip.title = t.fleet;
  }
  chip.appendChild(document.createTextNode(t.destination + '행'));
  chip.appendChild(el('span', 'no', t.trainNo));
  return chip;
}

/* ---------- 환승 ---------- */

function transferToggle(name, panelId) {
  const btn = el('button', null, name);
  btn.type = 'button';
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('aria-controls', panelId);
  btn.addEventListener('click', () => {
    const panel = document.getElementById(panelId);
    const opening = panel.hidden;
    panel.hidden = !opening;
    btn.setAttribute('aria-expanded', String(opening));
  });
  return btn;
}

function buildTransferPanel(id, info) {
  const box = el('div', 'transfer');
  box.id = id;
  box.hidden = true;
  for (const g of groupDoors(info.doors)) {
    const row = el('div', 'tr-row');
    // 시종착역은 열차 방면을 가릴 것이 없어 이 칸이 빈다. 자리는 남겨 세로줄을 맞춘다.
    row.appendChild(el('span', 'tr-dir', g.trainDirection ? g.trainDirection + ' 방면' : ''));
    row.appendChild(buildTargetCell(g));
    row.appendChild(el('span', 'tr-door', g.spots.join(', ')));
    box.appendChild(row);
  }
  if (info.note) box.appendChild(el('p', 'tr-note', info.note));
  return box;
}

/** 갈아탈 노선. 여럿이면 슬래시로 이어져 있으므로 쪼개서 각각 색 동그라미를 붙인다. */
function buildTargetCell(g) {
  const cell = el('span', 'tr-line');
  g.targetLine.split('/').forEach((name, i) => {
    if (i > 0) cell.appendChild(document.createTextNode(', '));
    const dot = lineDot(name);
    if (dot) cell.appendChild(dot);
    cell.appendChild(document.createTextNode(name.trim()));
  });
  if (g.targetDirection) cell.appendChild(document.createTextNode(' ' + g.targetDirection + ' 방면'));
  return cell;
}

/**
 * 노선 색 동그라미. 정확히 일치하는 이름을 먼저 찾고, 없으면 그 이름으로 시작하는 키를
 * 쓴다 - "2호선 신정지선" 과 "5호선 (방화 방면)" 이 본선 색을 받게 하려는 것이다.
 */
function lineDot(name) {
  const target = name.trim();
  let color = transferColors[target];
  if (!color) {
    const key = Object.keys(transferColors).find(k => target.startsWith(k));
    if (key) color = transferColors[key];
  }
  if (!color) return null;
  const dot = el('span', 'line-dot');
  dot.style.background = color;
  return dot;
}

/** 같은 방면, 같은 노선으로 가는 문이 여럿이면 한 줄로 합친다 (강남에서 2호선이 그렇다). */
function groupDoors(doors) {
  const groups = new Map();
  for (const d of doors) {
    const key = JSON.stringify([d.trainDirection, d.targetLine, d.targetDirection]);
    let g = groups.get(key);
    if (!g) {
      g = { trainDirection: d.trainDirection, targetLine: d.targetLine, targetDirection: d.targetDirection, spots: [] };
      groups.set(key, g);
    }
    g.spots.push(d.car + '-' + d.door);
  }
  return [...groups.values()];
}

/* ---------- 노선 섹션 ---------- */

function buildSection(line) {
  const section = el('section', 'line');
  section.dataset.slug = line.slug;

  const head = el('div', 'line-head');
  const toggle = el('button', 'line-toggle');
  toggle.type = 'button';
  const dot = el('span', 'dot');
  dot.style.background = line.color;
  toggle.appendChild(dot);
  toggle.appendChild(document.createTextNode(line.name));
  const caret = el('span', 'caret');
  toggle.appendChild(caret);
  head.appendChild(toggle);

  const status = el('span', 'line-status', '');
  head.appendChild(status);
  section.appendChild(head);

  const body = el('div', 'line-body');
  body.appendChild(buildLegend(line));
  if (line.fleet) body.appendChild(buildFleetLegend(line));
  body.appendChild(buildRail(line));
  body.appendChild(buildScope(line, section));
  const credits = buildCredits(line);
  if (credits) body.appendChild(credits);
  section.appendChild(body);

  const apply = () => {
    const open = isOpen(line.slug);
    body.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
    caret.textContent = open ? '▾' : '▸';
    if (!open) status.textContent = '';
  };
  toggle.addEventListener('click', () => {
    toggleIn(view.open, line.slug);
    apply();
    if (isOpen(line.slug)) refresh(line);
  });
  apply();

  return section;
}

function buildLegend(line) {
  const p = el('p', 'legend');
  p.appendChild(document.createTextNode(
    '왼쪽이 ' + line.upLabel + ' 방면, 오른쪽이 ' + line.downLabel + ' 방면입니다. '));
  if (!line.circular) {
    const b = el('b', null, '단축 운행');
    p.appendChild(b);
    p.appendChild(document.createTextNode('은 노선 끝까지 가지 않는 열차입니다. '));
  }
  p.appendChild(document.createTextNode('밑줄 친 역 이름을 누르면 환승 문 위치가 열립니다.'));
  return p;
}

function buildFleetLegend(line) {
  const box = el('div', 'fleet-legend');
  for (const g of line.fleet.generations) {
    // 차수마다 그 차수를 다루는 문단으로 간다. 색이 무엇을 뜻하는지 여기서 바로 확인된다.
    const chip = el('a', 'fleet-chip', g.label);
    chip.style.setProperty('--fleet', g.color);
    chip.title = g.note;
    chip.href = g.url;
    chip.rel = 'noopener';
    chip.target = '_blank';
    box.appendChild(chip);
  }
  return box;
}

/**
 * 출처 표기. 노선마다 가져온 문서가 다르고, 위키는 계속 고쳐지므로 판까지 적는다.
 * CC BY 조건이라 뺄 수 없다.
 */
function buildCredits(line) {
  const transfer = transfersByLine[line.slug];
  const items = [];
  if (transfer && transfer.source) {
    items.push(['환승 문 위치', transfer.source.document, transfer.source.revision, transfer.source.url]);
  }
  if (line.fleet) {
    items.push(['편성 차수', line.fleet.sourceDocument, line.fleet.sourceRevision, line.fleet.sourceUrl]);
  }
  if (items.length === 0) return null;

  const box = el('div', 'credits');
  for (const [what, doc, rev, url] of items) {
    const row = el('div');
    row.appendChild(document.createTextNode(what + ': 나무위키 '));
    const a = el('a', null, doc + ' ' + rev);
    a.href = url;
    a.rel = 'noopener';
    a.target = '_blank';
    row.appendChild(a);
    box.appendChild(row);
  }

  const license = transfer && transfer.source ? transfer.source : null;
  const row = el('div');
  row.appendChild(document.createTextNode('나무위키 문서는 '));
  const a = el('a', null, license ? license.license : 'CC BY-NC-SA 2.0 KR');
  a.href = license ? license.licenseUrl : 'https://creativecommons.org/licenses/by-nc-sa/2.0/kr/';
  a.rel = 'license noopener';
  a.target = '_blank';
  row.appendChild(a);
  row.appendChild(document.createTextNode(' 를 따릅니다.'));
  box.appendChild(row);
  return box;
}

function buildScope(line, section) {
  const box = el('div', 'scope');
  if (line.focusFrom === null || line.focusTo === null) return box;

  const btn = el('button');
  btn.type = 'button';
  const note = el('span', 'scope-note', '');
  const apply = () => {
    btn.textContent = isFull(line.slug)
      ? '관심 구간만 보기'
      : '전 구간 보기 (' + line.stations.length + '역)';
  };
  btn.addEventListener('click', () => {
    toggleIn(view.full, line.slug);
    apply();
    const rail = section.querySelector('.rail');
    rail.replaceWith(buildRail(line));
    refresh(line);
  });
  apply();
  box.appendChild(btn);
  box.appendChild(note);
  return box;
}

/* ---------- 데이터 ---------- */

function describeAge(iso) {
  if (!iso) return '아직 받지 못했습니다';
  const sec = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (sec < 60) return sec + '초 전 기준';
  return Math.floor(sec / 60) + '분 전 기준';
}

function renderBudget() {
  const box = document.getElementById('budget');
  const open = lines.filter(l => isOpen(l.slug) && l.budgeted).length;
  const parts = ['서울시 API ' + budget.apiCallCount + ' / ' + budget.apiCallBudget + '회'];
  if (open > 1) parts.push('펼친 노선이 ' + open + '개라 갱신 한 번에 ' + open + '회씩 나갑니다');
  box.textContent = parts.join('. ');
}

async function refresh(line) {
  const section = document.querySelector('.line[data-slug="' + line.slug + '"]');
  if (!section || !isOpen(line.slug)) return;
  const status = section.querySelector('.line-status');
  try {
    const res = await fetch('/api/lines/' + line.slug + '/trains', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const outside = placeTrains(section, line, data.trains);
    budget.apiCallCount = data.apiCallCount;
    renderBudget();

    let text = '열차 ' + data.trains.length + '대 / ' + describeAge(data.fetchedAt);
    if (outside > 0) text += ' / 구간 밖 ' + outside + '대';
    status.textContent = text;
  } catch (e) {
    status.textContent = '불러오지 못했습니다';
  }
}

function refreshOpen() {
  for (const line of lines) {
    if (isOpen(line.slug)) refresh(line);
  }
}

async function loadTransfers(line) {
  const res = await fetch('/api/lines/' + line.slug + '/transfers', { cache: 'no-store' });
  if (!res.ok) return;
  const data = await res.json();
  if (data.stations.length === 0) return;
  transfersByLine[line.slug] = {
    byStation: new Map(data.stations.map(s => [s.station, s])),
    source: data.source,
  };
}

async function boot() {
  loadView();
  const res = await fetch('/api/lines', { cache: 'no-store' });
  const data = await res.json();
  lines = data.lines;
  transferColors = data.transferColors || {};
  budget = { apiCallBudget: data.apiCallBudget, apiCallCount: data.apiCallCount };

  // 저장된 것이 없으면 첫 노선만 펼친다. 펼친 노선 수만큼 호출 예산이 나가므로
  // 전부 펼친 채로 시작하지 않는다.
  if (view.open.length === 0) view.open = [lines[0].slug];

  // 환승 데이터는 정적이라 한 번만 받는다. 노선도를 그릴 때 필요하므로 먼저 받는다.
  await Promise.all(lines.map(l => loadTransfers(l).catch(() => {})));

  const box = document.getElementById('lines');
  box.replaceChildren(...lines.map(buildSection));
  renderBudget();
  refreshOpen();
}

boot();
setInterval(refreshOpen, REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refreshOpen();
});
</script>
</body>
</html>
