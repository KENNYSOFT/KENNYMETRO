# 노선 정의. 역 목록이 800개에 가까워 코드에 박지 않고 여기 둔다.
#
# 역명이 서울시 실시간 지하철 API 와 한 글자라도 다르면 그 역에 있는 열차와 그 역으로 가는
# 열차가 화면에서 사라진다. API 가 붙이는 괄호 부기(`군자(능동)`)와 2호선 꼬리말(`성수종착`)은
# 서버가 떼어 내므로 여기 적지 않는다. 이름부터 다른 역만 station-aliases 에 적는다.
#
# 역 목록의 초안은 위키백과의 노선 문서에서 옮겼고, 표기의 정본은 API 다. 위키백과 표에서
# 역명이 기울임인 역은 미개통이라 담지 않는다. 끊긴 두 구간을 잇는 역(GTX-A 삼성)만 no-service
# 로 담는다. 노선을 더하거나 연장 구간이 생기면
# `scripts/probe-coverage.sh` 를 운행 시간대에 돌려 API 가 주는 역명과 대조한다. 운영 중에
# 모르는 역명이 오면 서버도 로그로 남긴다.
#
# termini 는 그 노선 열차가 평소 가는 종착역이다. 여기 없는 종착역은 그 사이면 단축, 바깥이면
# 연장으로 표시한다. 적지 않으면 역 목록의 양 끝이다. beyond 는 어느 뷰에도 없는 종착역과 그
# 열차가 이 뷰를 떠나는 역이다. 같은 api-name 의 다른 뷰에 있는 종착역은 적지 않아도 된다.
#
# focus 는 [시작역, 끝역] 이고 화면이 기본으로 보여줄 구간이다. key-stations 는 그 안에서
# 굵게 세울 역이다. 둘 다 처음 방문한 브라우저의 기본값일 뿐이고, 사람이 고친 값은 그
# 브라우저에 남는다.
#
# updn-line-reversed 는 실시간 API 의 updnLine 0(상행)이 역 목록의 뒤쪽을 가리키는 노선에 적는다.
# 노선 중간에서 종착역과 updnLine 이 어긋나는 열차를 가려내고, 종착역을 알 수 없을 때 방향을 정하는
# 데 쓴다(DESIGN.md 2.2.2). 노선을 더하면 운행 시간대에 받은 열차로 확인한다.
#
# up / down 은 역 목록의 앞쪽과 뒤쪽이다. 화면에서 up 이 왼쪽이다. down-only 는 열차가 down
# 쪽으로만 지나는 역이다. 화면은 그 역의 왼쪽 화살표를 그리지 않고, 방면 없이 적힌 환승 문을
# 오른쪽 칸에만 둔다. no-service 는 열차가 서지도 지나지도 않는 역이다. 화면은 흐리게 세우고
# 화살표를 그리지 않으며, 그 바로 옆 역은 목록의 끝 역처럼 열차가 한쪽에서만 들어온다고 본다.
#
# transfer-file 은 환승 문 파일(transfer/<이름>-doors.csv)의 이름이고 적지 않으면 slug 다.
# 지선마다 뷰를 둔 노선은 옮겨 온 문서가 하나라 파일 하나를 나눠 쓰고, 뷰마다 자기 역만 가져간다.

metro:
  # 처음 방문한 브라우저에 보여줄 노선과 그 순서. 고르고 나면 그 브라우저에 남으므로
  # 이 값은 출발점일 뿐이다. 각 노선의 focus 와 key-stations 도 같은 뜻의 기본값이다.
  preset: [shinbundang, line2, line9, suinbundang, everline]

  # 환승 대상 노선의 색. 환승 문 위치에 노선 동그라미를 붙이는 데만 쓴다.
  #
  # 화면은 정확히 일치하는 이름을 먼저 찾고, 없으면 그 이름으로 시작하는 키를 쓴다.
  # 그래서 "2호선 신정지선" 과 "5호선 (방화 방면)" 도 본선 색을 받는다.
  #
  # 키를 대괄호로 감싸는 것은 형식이 아니라 필수다. 그러지 않으면 Spring 의 relaxed
  # binding 이 키에서 한글을 떼어내 1호선과 인천1호선이 둘 다 "1" 로 뭉개진다.
  transfer-colors:
    "[1호선]": "#0052a4"
    "[2호선]": "#00a84d"
    "[3호선]": "#ef7c1c"
    "[4호선]": "#00a5de"
    "[5호선]": "#996cac"
    "[6호선]": "#cd7c2f"
    "[7호선]": "#747f00"
    "[8호선]": "#e6186c"
    "[9호선]": "#bdb092"
    "[신분당선]": "#d4003b"
    "[수인분당선]": "#fabe00"
    "[경의중앙선]": "#77c4a3"
    "[경춘선]": "#0c8e72"
    "[경강선]": "#003da5"
    "[공항철도]": "#0090d2"
    "[김포 골드라인]": "#a17800"
    "[서해선]": "#8fc31f"
    "[신림선]": "#6789ca"
    "[우이신설선]": "#b0ce18"
    "[인천1호선]": "#7ca8d5"
    "[인천2호선]": "#ed8b00"
    "[의정부경전철]": "#fda600"
    "[GTX-A]": "#9a6292"
    "[용인경전철]": "#56ab2e"

  # 실시간 API 가 이름부터 다르게 적는 역. 키가 API 쪽이다. 대괄호는 transfer-colors 와 같은
  # 이유로 필수다.
  station-aliases:
    # 1호선, 4호선, 경의중앙선, 공항철도가 "서울" 로 준다. GTX-A 만 "서울역" 이다.
    "[서울]": 서울역
    # 역명이 평택지제로 바뀐 뒤에도 API 는 옛 이름을 쓴다.
    "[지제]": 평택지제
    # 6호선 서쪽으로 가는 열차의 종착. 응암에서 역촌, 구산을 돌아 나오는 순환 구간으로 든다.
    "[응암순환]": 응암

  # 노선마다 이름이 다른 환승역. 환승 문을 대조할 때 같은 역으로 본다. 대괄호는 위와 같은
  # 이유로 필수다.
  transfer-names:
    # 4호선은 총신대입구, 7호선은 이수라고 부른다.
    "[총신대입구]": 이수

  # 서울시 역별 시간표가 있는 노선. 키는 api-name, 값은 시간표 API 가 그 노선을 적는 이름이다. 노선
  # 중간에서 종착역과 updnLine 이 어긋나는 열차를 이 시간표로 다시 본다(DESIGN.md 2.2.2). 1~9호선에만
  # 있고 한국철도공사가 운영하는 1, 3, 4호선 구간도 들어 있다. 다른 노선은 역 코드가 있어도 시간표가
  # 비어 온다. 대괄호는 transfer-colors 와 같은 이유로 필수다.
  timetable-lines:
    "[1호선]": "01호선"
    "[2호선]": "02호선"
    "[3호선]": "03호선"
    "[4호선]": "04호선"
    "[5호선]": "05호선"
    "[6호선]": "06호선"
    "[7호선]": "07호선"
    "[8호선]": "08호선"
    "[9호선]": "09호선"

  lines:
    # 1호선은 구로에서 인천 방면과 신창 방면으로 갈려 역을 한 줄로 세울 수 없다.
    # 계통마다 뷰를 따로 두되 api-name 이 같아 실시간 위치는 한 번만 받는다.
    # 다른 계통으로 가는 열차도 갈라지는 역(구로)까지는 그 뷰에 다른 계통으로 그려진다.
    - slug: line1-gyeongin
      name: 1호선 (경인)
      api-name: 1호선
      color: "#0052a4"
      source: seoul
      transfer-file: line1
      up-label: 연천
      down-label: 인천
      termini: [연천, 소요산, 동두천, 양주, 광운대, 용산, 인천, 동인천]
      stations: [연천, 전곡, 청산, 소요산, 동두천, 보산, 동두천중앙, 지행, 덕정, 덕계, 양주, 녹양, 가능, 의정부, 회룡,
                 망월사, 도봉산, 도봉, 방학, 창동, 녹천, 월계, 광운대, 석계, 신이문, 외대앞, 회기,
                 청량리, 제기동, 신설동, 동묘앞, 동대문, 종로5가, 종로3가, 종각, 시청, 서울역, 남영,
                 용산, 노량진, 대방, 신길, 영등포, 신도림, 구로, 구일, 개봉, 오류동, 온수, 역곡, 소사,
                 부천, 중동, 송내, 부개, 부평, 백운, 동암, 간석, 주안, 도화, 제물포, 도원, 동인천, 인천]

    - slug: line1-gyeongbu
      name: 1호선 (경부)
      api-name: 1호선
      color: "#0052a4"
      source: seoul
      transfer-file: line1
      up-label: 연천
      down-label: 신창
      termini: [연천, 소요산, 동두천, 양주, 광운대, 병점, 천안, 신창]
      # 병점에서 서동탄으로 갈라지는 열차. 금천구청에서 광명으로 가는 열차는 아래 광명셔틀 뷰에 광명이
      # 있어 적지 않아도 금천구청을 향해 그려진다.
      beyond:
        "[서동탄]": 병점
      stations: [연천, 전곡, 청산, 소요산, 동두천, 보산, 동두천중앙, 지행, 덕정, 덕계, 양주, 녹양, 가능, 의정부, 회룡,
                 망월사, 도봉산, 도봉, 방학, 창동, 녹천, 월계, 광운대, 석계, 신이문, 외대앞, 회기,
                 청량리, 제기동, 신설동, 동묘앞, 동대문, 종로5가, 종로3가, 종각, 시청, 서울역, 남영,
                 용산, 노량진, 대방, 신길, 영등포, 신도림, 구로, 가산디지털단지, 독산, 금천구청, 석수,
                 관악, 안양, 명학, 금정, 군포, 당정, 의왕, 성균관대, 화서, 수원, 세류, 병점, 세마,
                 오산대, 오산, 진위, 송탄, 서정리, 평택지제, 평택, 성환, 직산, 두정, 천안, 봉명, 쌍용,
                 아산, 탕정, 배방, 온양온천, 신창]

    # 영등포에서 광명까지 다니는 셔틀. 경부 뷰에서는 금천구청에서 갈라져 나가는 열차로만 보여, 광명역에서
    # 타고 내리는 구간을 따로 세운다. API 로는 1호선이라 받아 온 것을 나눠 쓴다. 이름을 "1호선 (광명셔틀)"
    # 로 두어야 환승 표가 적는 "1호선 광명셔틀" 이 이 뷰를 찾는다.
    - slug: line1-gwangmyeong
      name: 1호선 (광명셔틀)
      api-name: 1호선
      color: "#0052a4"
      source: seoul
      transfer-file: line1
      up-label: 영등포
      down-label: 광명
      stations: [영등포, 신도림, 구로, 가산디지털단지, 독산, 금천구청, 광명]

    # 순환선이라 종착역으로 방향을 정할 수 없다. 이 노선만 updnLine 을 그대로 쓴다. 같은
    # 열차를 두 번 받아 움직인 쪽을 보니 0(내선)은 역 순서가 커지는 쪽, 1(외선)은 작아지는
    # 쪽이었다. 그래서 목록 위쪽으로 가는 왼쪽이 외선이고 updn-line-reversed 다.
    # 지선으로 가는 열차는 이 뷰에 그리지 않고 아래 지선 뷰가 보여준다.
    - slug: line2
      name: 2호선
      color: "#00a84d"
      source: seoul
      circular: true
      updn-line-reversed: true
      up-label: 외선
      down-label: 내선
      # 종착은 대부분 성수로 온다. 성수에서 운행이 바뀔 뿐 열차는 계속 돌므로 성수만 평소 종착역으로
      # 둔다. 신도림에서 끝나는 열차는 정말 끝나 차량기지로 들어가므로 단축이다(DESIGN.md 1.6).
      termini: [성수]
      focus: [강남, 잠실]
      key-stations: [강남, 삼성, 잠실]
      stations: [시청, 을지로입구, 을지로3가, 을지로4가, 동대문역사문화공원, 신당, 상왕십리, 왕십리,
                 한양대, 뚝섬, 성수, 건대입구, 구의, 강변, 잠실나루, 잠실, 잠실새내, 종합운동장, 삼성,
                 선릉, 역삼, 강남, 교대, 서초, 방배, 사당, 낙성대, 서울대입구, 봉천, 신림, 신대방,
                 구로디지털단지, 대림, 신도림, 문래, 영등포구청, 당산, 합정, 홍대입구, 신촌, 이대, 아현,
                 충정로]

    # 2호선 지선은 순환하지 않는 짧은 선형 노선이라 따로 둔다. API 로는 2호선 하나다.
    # 성수 쪽으로 가는 열차의 종착은 "성수지선" 으로 오는데, 서버가 꼬리말을 떼어 성수로 본다.
    - slug: line2-seongsu
      name: 2호선 (성수지선)
      api-name: 2호선
      color: "#00a84d"
      source: seoul
      up-label: 성수
      down-label: 신설동
      stations: [성수, 용답, 신답, 용두, 신설동]

    # 성수지선과 달리 updnLine 0 이 까치산 쪽으로 온다(2026-09-23 10:51 과 10:55 에 받은 3대가 모두 그랬다).
    - slug: line2-sinjeong
      name: 2호선 (신정지선)
      api-name: 2호선
      color: "#00a84d"
      source: seoul
      updn-line-reversed: true
      up-label: 신도림
      down-label: 까치산
      stations: [신도림, 도림천, 양천구청, 신정네거리, 까치산]

    - slug: line3
      name: 3호선
      color: "#ef7c1c"
      source: seoul
      up-label: 대화
      down-label: 오금
      stations: [대화, 주엽, 정발산, 마두, 백석, 대곡, 화정, 원당, 원흥, 삼송, 지축, 구파발, 연신내,
                 불광, 녹번, 홍제, 무악재, 독립문, 경복궁, 안국, 종로3가, 을지로3가, 충무로, 동대입구,
                 약수, 금호, 옥수, 압구정, 신사, 잠원, 고속터미널, 교대, 남부터미널, 양재, 매봉, 도곡,
                 대치, 학여울, 대청, 일원, 수서, 가락시장, 경찰병원, 오금]

    # 대부분 불암산에서 돌아가고 진접까지 가는 열차는 일부다.
    - slug: line4
      name: 4호선
      color: "#00a5de"
      source: seoul
      up-label: 진접
      down-label: 오이도
      termini: [불암산, 오이도]
      stations: [진접, 오남, 풍양, 별내별가람, 불암산, 상계, 노원, 창동, 쌍문, 수유, 미아, 미아사거리,
