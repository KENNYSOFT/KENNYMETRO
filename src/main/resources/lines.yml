# 노선 정의. 역 목록이 175개라 코드에 박지 않고 여기 둔다.
#
# 역명은 서울시 실시간 지하철 API 의 표기를 그대로 따라야 한다. 한 글자라도 다르면
# 그 역에 있는 열차가 화면에서 사라진다. 괄호 부기는 붙이지 않는다.
#
# focus 는 [시작역, 끝역] 이고 화면이 기본으로 보여줄 구간이다. key-stations 는 그 안에서
# 굵게 세울 역이다. 둘 다 지금은 고정값이지만 나중에 사람마다 다르게 둘 자리다.
#
# up / down 은 서울시 API 의 updnLine 값 0 과 1 에 각각 대응한다. 화면에서 up 이 왼쪽이다.

metro:
  lines:
    - slug: shinbundang
      name: 신분당선
      color: "#bb1833"
      source: seoul
      up-label: 신사
      down-label: 광교
      focus: [논현, 상현]
      key-stations: [강남, 동천, 수지구청]
      stations: [신사, 논현, 신논현, 강남, 양재, 양재시민의숲, 청계산입구, 판교, 정자, 미금,
                 동천, 수지구청, 성복, 상현, 광교중앙, 광교]
      # 이 노선만 열차번호가 1~2자리이고 편성번호와 범위가 맞는다. 다른 노선은 4자리
      # 운행번호라 어느 차량인지 알 수 없어 차수를 매기지 않는다.
      #
      # 차수마다 그 차수를 다루는 문단으로 링크를 건다. 편성 범위는 같은 문서의
      # /현황 하위 문서에 있는 표에서 옮겼다.
      fleet:
        source-name: 나무위키
        generations:
          - label: 1차분
            color: "#8b5cf6"
            from: 1
            to: 12
            note: 2010~2011년 제작. 강남-정자 개통분
            url: https://namu.wiki/w/네오트랜스 D000호대 전동차#s-4.1
          - label: 2차분
            color: "#0ea5e9"
            from: 13
            to: 20
            note: 2014~2015년 제작. 정자-광교 연장분
            url: https://namu.wiki/w/네오트랜스 D000호대 전동차#s-4.2
          - label: 3차분
            color: "#10b981"
            from: 21
            to: 23
            note: 2020년 제작. 강남-신사 연장분
            url: https://namu.wiki/w/네오트랜스 D000호대 전동차#s-4.3

    # 순환선이라 종착역으로 방향을 정할 수 없다. 게다가 종착 표기가 "성수종착",
    # "신도림지선" 처럼 역명이 아닌 값으로 온다. 이 노선만 updnLine 을 그대로 쓴다.
    # 지선(성수지선, 신정지선)은 담지 않는다. 그 열차는 역 매칭에 걸리지 않아 빠진다.
    - slug: line2
      name: 2호선
      color: "#00a84d"
      source: seoul
      circular: true
      up-label: 내선
      down-label: 외선
      focus: [강남, 잠실]
      key-stations: [강남, 삼성, 잠실]
      stations: [시청, 을지로입구, 을지로3가, 을지로4가, 동대문역사문화공원, 신당, 상왕십리,
                 왕십리, 한양대, 뚝섬, 성수, 건대입구, 구의, 강변, 잠실나루, 잠실, 잠실새내,
                 종합운동장, 삼성, 선릉, 역삼, 강남, 교대, 서초, 방배, 사당, 낙성대,
                 서울대입구, 봉천, 신림, 신대방, 구로디지털단지, 대림, 신도림, 문래,
                 영등포구청, 당산, 합정, 홍대입구, 신촌, 이대, 아현, 충정로]

    - slug: line9
      name: 9호선
      color: "#bdb092"
      source: seoul
      up-label: 개화
      down-label: 중앙보훈병원
      focus: [김포공항, 종합운동장]
      key-stations: [김포공항, 여의도, 고속터미널, 신논현]
      stations: [개화, 김포공항, 공항시장, 신방화, 마곡나루, 양천향교, 가양, 증미, 등촌,
                 염창, 신목동, 선유도, 당산, 국회의사당, 여의도, 샛강, 노량진, 노들, 흑석,
                 동작, 구반포, 신반포, 고속터미널, 사평, 신논현, 언주, 선정릉, 삼성중앙,
                 봉은사, 종합운동장, 삼전, 석촌고분, 석촌, 송파나루, 한성백제, 올림픽공원,
                 둔촌오륜, 중앙보훈병원]

    - slug: suinbundang
      name: 수인분당선
      color: "#fabe00"
      source: seoul
      up-label: 청량리
      down-label: 인천
      focus: [선릉, 기흥]
      key-stations: [미금, 선릉, 정자, 기흥]
      stations: [청량리, 왕십리, 서울숲, 압구정로데오, 강남구청, 선정릉, 선릉, 한티, 도곡,
                 구룡, 개포동, 대모산입구, 수서, 복정, 가천대, 태평, 모란, 야탑, 이매, 서현,
                 수내, 정자, 미금, 오리, 죽전, 보정, 구성, 신갈, 기흥, 상갈, 청명, 영통,
                 망포, 매탄권선, 수원시청, 매교, 수원, 고색, 오목천, 어천, 야목, 사리,
                 한대앞, 중앙, 고잔, 초지, 안산, 신길온천, 정왕, 오이도, 달월, 월곶,
                 소래포구, 인천논현, 호구포, 남동인더스파크, 원인재, 연수, 송도, 숭의,
                 신포, 인천]

    # 서울시 API 에 없다. 용인경전철 공식 실시간 페이지가 쓰는 엔드포인트를 따로 부른다
    # (DESIGN.md 2.4). 호출 제한이 없어 예산 계산에서 빠진다.
    #
    # 공식 역명은 시청과 용인대 사이, 전대와 에버랜드 사이에 가운뎃점이 들어간다.
    # 키보드로 입력할 수 없는 글자라 여기서는 공백으로 적는다. 이 엔드포인트는 역명을
    # 주지 않고 코드만 주므로 표기를 우리가 정할 수 있다.
    - slug: everline
      name: 용인경전철
      color: "#56ab2e"
      source: everline
      up-label: 기흥
      down-label: 전대 에버랜드
      focus: [기흥, 삼가]
      key-stations: [기흥, 삼가]
      stations: [기흥, 강남대, 지석, 어정, 동백, 초당, 삼가, 시청 용인대, 명지대, 김량장,
                 용인중앙시장, 고진, 보평, 둔전, 전대 에버랜드]
