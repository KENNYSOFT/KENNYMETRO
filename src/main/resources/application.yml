spring:
  application:
    name: kennymetro
  # 노선 정의는 역 목록이 175개라 파일을 나눴다.
  config:
    import: classpath:lines.yml
  threads:
    virtual:
      enabled: true
  web:
    resources:
      # 화면(HTML, SVG)을 이미지 밖 볼륨에서 먼저 찾는다. 화면만 고친 변경은 native 재빌드 없이 파일만
      # 올려 반영한다(README 의 "화면만 고칠 때"). 볼륨이 없는 환경(로컬 실행, 테스트)은 뒤의
      # classpath 로 떨어진다. 상대 경로라 호출 원장처럼 작업 디렉토리 기준이고, 컨테이너에서는
      # /app/data/static 이다.
      static-locations:
        - file:${KENNYMETRO_STATIC_ROOT:data/static}/
        - classpath:/static/
      cache:
        # 파일을 바꾸면 바로 보이도록 브라우저가 매번 바뀌었는지 묻게 한다. 그대로면 304 로 끝난다.
        cachecontrol:
          no-cache: true

server:
  port: 8080
  shutdown: graceful
  # httpd 리버스 프록시 뒤에서 돈다. 이 설정이 없으면 앱이 원래 스킴을 http 로 보고
  # 절대 URL 과 리다이렉트를 http 로 내보낸다.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    kr.kennysoft.kennymetro: INFO

seoul-subway:
  # 실시간 지하철 전용 인증키(일반 인증키와 별도로 신청한다). 기본값을 두지 않아
  # 미주입 시 기동이 실패한다.
  api-key: ${SEOUL_SUBWAY_API_KEY}
  base-url: http://swopenapi.seoul.go.kr/api/subway
  # 역별 시간표. 종착역이 진행 방향과 어긋나는 열차를 다시 볼 때만 부른다(DESIGN.md 2.2.2).
  # 실시간 API 와 다른 서비스지만 같은 인증키로 부른다.
  timetable-base-url: http://openapi.seoul.go.kr:8088
  # 하루 1,000회 제한이라 운행시간 19시간을 나누면 70초에 1회다. 활용사례 갤러리에
  # 등록해 제한이 풀리면 줄일 수 있다.
  cache-ttl: 70s
  # 응답이 늦어도 이 시간을 넘기면 캐시된 값으로 답한다.
  request-timeout: 5s
  # 화면에 남은 예산을 보여주는 데만 쓴다. 이 값을 넘겨도 서버가 호출을 막지는 않는다.
  daily-call-budget: 1000
  # 날짜별 호출 수를 남길 파일. 컨테이너에서는 이 경로에 볼륨을 붙여 재배포해도
  # 그 날 쓴 호출이 이어지게 한다 (README 배포 절차). 없으면 만든다.
  call-log-path: ${KENNYMETRO_CALL_LOG:data/api-calls.log}

# 용인경전철. 인증이 없고 호출 제한도 공지되어 있지 않아 위 예산에 들지 않는다.
everline:
  base-url: https://everlinecu.com
  request-timeout: 5s
