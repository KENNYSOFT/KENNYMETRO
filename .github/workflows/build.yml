name: build

# 문서만 바뀐 push 는 빌드하지 않는다. native 빌드가 수 분씩 걸려서 md 한 줄 고칠 때마다
# 도는 것이 낭비다. 문서 외 파일이 하나라도 섞이면 정상적으로 전체가 돈다.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore: *docs

# A1 이 aarch64 이므로 ARM runner 를 쓴다. native image 는 크로스 컴파일이 불가능해
# x86 runner 산출물은 서버에서 실행되지 않는다. public repo 는 ARM64 runner 가 무료다.

env:
  # 인증키는 기본값이 없어 미주입 시 기동이 실패한다. 테스트와 AOT 처리가 컨텍스트를
  # 훑으므로 더미 값을 넣는다. 실제 API 는 스모크 테스트에서도 부르지 않는다(stub 사용).
  SEOUL_SUBWAY_API_KEY: ci-dummy-key

jobs:
  jvm:
    name: JVM 빌드 + 테스트
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - name: 테스트 리포트 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/
          retention-days: 7

  native:
    name: native image 빌드 + 스모크 테스트 (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew nativeCompile -x test
      - name: 산출물 확인
        run: |
          ls -la build/native/nativeCompile/
          file build/native/nativeCompile/kennymetro
      # JVM 테스트로는 native 전용 결함(Kotlin 빈 컬렉션 메타데이터 누락)이 잡히지 않는다.
      # 바이너리를 실제로 띄워 열차가 있는 응답과 0대인 응답을 모두 왕복한다 (DESIGN.md 4.1).
      - name: 스모크 테스트
        run: ./scripts/smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kennymetro-arm64
          path: build/native/nativeCompile/kennymetro
          retention-days: 7

  image:
    name: 컨테이너 이미지 → GHCR
    needs: [jvm, native]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: kennymetro-arm64
      - run: chmod +x kennymetro
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # OCI 레지스트리는 소문자만 허용한다. 계정명과 저장소명이 대문자(KENNYSOFT/KENNYMETRO)라
      # github.repository 를 그대로 쓰면 invalid tag 로 실패한다.
      - name: 이미지 이름 소문자화
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
